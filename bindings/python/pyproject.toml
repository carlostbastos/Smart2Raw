[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart2raw"
version = "3.3.6"
description = "Python wrapper for the Smart2Raw C library (auto-adaptive numeric storage)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
keywords = ["integer storage", "adaptive bit-width", "SIMD", "PFOR", "quantization"]

[project.scripts]
s2r-convert = "s2r_convert:main"

# Note: the C library (libsmart2raw.so/.dll) is built by build_lib.py.
# The wrapper locates it in the package directory or via the S2R_LIB variable.
