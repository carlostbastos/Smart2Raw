[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart2raw"
version = "3.3.5"
description = "Wrapper Python para a biblioteca C Smart2Raw (armazenamento numerico auto-adaptativo)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
keywords = ["integer storage", "adaptive bit-width", "SIMD", "PFOR", "quantization"]

[project.scripts]
s2r-convert = "s2r_convert:main"

# Nota: a biblioteca C (libsmart2raw.so/.dll) e compilada por build_lib.py.
# O wrapper a localiza no diretorio do pacote ou via a variavel S2R_LIB.
