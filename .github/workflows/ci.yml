name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x86:
    name: x86 matrix (server/edge/no-simd/c11/mcu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc
      - name: build + test (25 suites)
        run: bash scripts/build_and_test.sh

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build + run under -fsanitize=address,undefined
        run: |
          set -eu
          INC="-I include -I tests"
          FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          export ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          fails=0
          for t in test_completo test_regressao test_blocked test_blocked2 \
                   test_signed_lazy test_analytics test_analytics_v2 \
                   test_format_hardening test_filters_simd test_pfor_frame test_be_cow test_compat_original; do
            gcc $FLAGS $INC -o "/tmp/$t" "tests/$t.c"
            if out=$("/tmp/$t" 2>&1); then
              echo "[$t] $(echo "$out" | tail -1)"
            else
              echo "::error::[$t] failed (exit $?)"
              echo "$out" | tail -40
              fails=$((fails + 1))
            fi
          done
          [ "$fails" -eq 0 ]

  cross:
    name: cross-arch real via QEMU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, linux/s390x]   # arm64 = NEON real ; s390x = big-endian real
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: build + run functional tests on ${{ matrix.platform }}
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src gcc:13 bash -c '
            set -eu
            INC="-I include -I tests"   # NEON and big-endian are REAL here (arm64/s390x); no emulation shims
            fails=0
            for t in test_completo test_regressao test_blocked test_blocked2 \
                     test_signed_lazy test_analytics test_analytics_v2 \
                     test_format_hardening test_filters_simd test_pfor_frame test_be_cow test_compat_original; do
              gcc -O2 $INC -o "/tmp/$t" "tests/$t.c"
              # Do NOT write this as `/tmp/$t | tail -1`: without pipefail the
              # pipeline exit status comes from tail, so a failing or crashing test
              # produced a green check. This is the only job that exercises
              # big-endian, so a silent pass here hid real breakage.
              if out=$("/tmp/$t" 2>&1); then
                echo "[$t] $(echo "$out" | tail -1)"
              else
                echo "[$t] FAILED (exit $?)"
                echo "$out" | tail -40
                fails=$((fails + 1))
              fi
            done
            [ "$fails" -eq 0 ]
          '

  ports:
    name: ports (${{ matrix.port }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        port: [go, js, python]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.port == 'go'
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - if: matrix.port == 'js'
        uses: actions/setup-node@v4
        with: { node-version: '20' }
      - if: matrix.port == 'python'
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: test ${{ matrix.port }}
        run: |
          set -eu
          case "${{ matrix.port }}" in
            go)     cd ports/go && go vet ./... && go test ./... ;;
            js)     cd ports/js && node --test ;;
            python) cd ports/python && python -m unittest discover -s tests -v ;;
          esac

  conformance:
    name: cross-language .s2r conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: regenerate fixtures + run every writer against every reader
        run: |
          set -eu
          python conformance/scripts/generate_fixtures.py
          bash conformance/run_conformance.sh
